# StageRig OS: kernel options for low-latency audio. Applied by update-grub.
#   preempt=full           the audio thread interrupts anything, at once
#   threadirqs             interrupt handlers become threads it can outrank
#   rcu_nocbs=all          kernel housekeeping is kept off the audio thread's path
#   usbcore.autosuspend=-1 USB audio and MIDI devices are never put to sleep
# The first three are what Ubuntu Studio sets.
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT preempt=full threadirqs rcu_nocbs=all usbcore.autosuspend=-1"
