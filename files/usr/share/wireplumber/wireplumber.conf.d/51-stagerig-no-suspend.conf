# StageRig OS: sound devices are never put to sleep when idle. Waking one
# costs a click and the first notes of whatever is played next.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.*" }
      { node.name = "~alsa_output.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
