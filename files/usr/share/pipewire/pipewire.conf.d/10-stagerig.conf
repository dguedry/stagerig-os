# StageRig OS: one fixed rate, so nothing resamples and no device is reopened
# when a program asks for another one. StageRig sets the buffer size itself
# while it runs (Audio... > LEVEL AND LATENCY).
# To change it, copy this file to /etc/pipewire/pipewire.conf.d/ and edit the copy.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]
}
